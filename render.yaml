# Render Blueprint: New > Blueprint, point it at this repo.
# Fill in the `sync: false` values in the dashboard when prompted.
databases:
  - name: docsage-db
    plan: free
    databaseName: docsage

services:
  - type: web
    name: docsage-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free            # use "starter" for always-on and more RAM
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: docsage-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false        # your Vercel URL, e.g. https://docsage.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false        # optional, for Vercel preview URLs
      - key: BFF_SECRET
        sync: false        # random string, the same value as BFF_SECRET in Vercel
      - key: RESEND_API_KEY
        sync: false        # for confirmation and password reset emails
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false        # the sending address, e.g. you@gmail.com
      - key: SMTP_PASSWORD
        sync: false        # Gmail App Password (16 characters, no spaces)
      - key: EMAIL_FROM
        sync: false        # e.g. DocSage <hello@yourdomain.com>
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"     # set "true" once email delivery works
      - key: SENTRY_DSN
        sync: false        # optional
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # "memory" works out of the box but re-embeds every chunk after each restart.
      # For a persistent index, create a free Qdrant Cloud cluster, then set
      # QDRANT_MODE=http and fill in QDRANT_URL and QDRANT_API_KEY.
      - key: QDRANT_MODE
        value: memory
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

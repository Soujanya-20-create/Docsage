# Used by the `alembic` command line (e.g. `alembic revision --autogenerate -m "add column"`).
# The API runs migrations itself at startup, using the DATABASE_URL from .env.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
